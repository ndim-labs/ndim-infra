[project]
name = "ndim-infra"
version = "0.1.0"
description = "Shared environment for nDimensions.AI LLM engineering (local GPU). Colab uses its preinstalled torch."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "numpy",
    "tiktoken",
    "wandb",
    "tqdm",
    "datasets",
    "transformers",
    "peft",
    "accelerate",
    "bitsandbytes",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
